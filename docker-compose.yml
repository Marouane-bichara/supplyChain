version: "3.8"

services:
  # ---------------------------------------------------
  # DATABASE (MYSQL)
  # ---------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: supplychainx-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: supplychainx
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - supplychainx-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u myuser -pmypassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------
  # PHPMYADMIN
  # ---------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    ports:
      - "8089:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
      PMA_ARBITRARY: 1
    networks:
      - supplychainx-network

  # ---------------------------------------------------
  # KEYCLOAK
  # ---------------------------------------------------
  keycloak:
    container_name: supplychainx-keycloak
    image: quay.io/keycloak/keycloak:25.0.5
    restart: unless-stopped
    ports:
      - "9090:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - keycloak_data:/opt/keycloak/data
    command:
      - start-dev
    networks:
      - supplychainx-network

  # ---------------------------------------------------
  # SPRING BOOT APP
  # ---------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supplychainx-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # MySQL
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/supplychainx?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: mypassword
      # Keycloak
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/supplychainx
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - supplychainx-network

  # ---------------------------------------------------
  # ELASTICSEARCH
  # ---------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - supplychainx-network

  # ---------------------------------------------------
  # LOGSTASH
  # ---------------------------------------------------
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.1
    container_name: logstash
    volumes:
      - ./logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    ports:
      - "5000:5000"
      - "9600:9600"
    depends_on:
      - elasticsearch
    networks:
      - supplychainx-network

  # ---------------------------------------------------
  # KIBANA
  # ---------------------------------------------------
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.1
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - supplychainx-network

  # ---------------------------------------------------
  # FILEBEAT
  # ---------------------------------------------------
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.1
    container_name: filebeat
    user: root
    command:
      - -e
      - --strict.perms=false
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - logstash
    networks:
      - supplychainx-network

# ---------------------------------------------------
# VOLUMES
# ---------------------------------------------------
volumes:
  mysql_data:
  elasticsearch_data:
  keycloak_data:

# ---------------------------------------------------
# NETWORKS
# ---------------------------------------------------
networks:
  supplychainx-network:
    driver: bridge
